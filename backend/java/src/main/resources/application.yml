renda:
  version: "@project.version@"
  # Primeiro administrador (ADR-005): usado só quando o banco ainda não tem nenhum usuário.
  bootstrap-admin:
    username: ${RENDA_BOOTSTRAP_ADMIN_USER:}
    password: ${RENDA_BOOTSTRAP_ADMIN_PASSWORD:}

spring:
  application:
    name: renda-erp-server
  datasource:
    url: ${RENDA_DB_URL:jdbc:postgresql://localhost:5432/renda}
    username: ${RENDA_DB_USER:renda}
    password: ${RENDA_DB_PASSWORD:renda}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  # Por padrão escuta só na própria máquina. Para outros computadores da rede, defina RENDA_SERVER_ADDRESS=0.0.0.0.
  address: ${RENDA_SERVER_ADDRESS:127.0.0.1}
  port: ${RENDA_SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
