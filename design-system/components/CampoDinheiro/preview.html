<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Campo de dinheiro</title>
<style>body{margin:0;padding:16px;background:var(--surface-form)}</style></head>
<body class="rp">
<div class="rp-form rp-form--req" style="grid-template-columns:140px 14px 200px">
  <span class="rp-label">Valor</span><span class="rp-req">*</span>
  <span class="rp-dinheiro"><span class="rp-dinheiro-simbolo">R$</span><input class="rp-field rp-field--num" value="23.579,23"><button class="rp-campo-icone" title="Calculadora"><i class="rp-ico rp-ico-calculadora"></i></button></span>
  <span class="rp-label">Desconto</span><span></span>
  <span class="rp-dinheiro"><span class="rp-dinheiro-simbolo">R$</span><input class="rp-field rp-field--num" value=""><button class="rp-campo-icone" title="Calculadora"><i class="rp-ico rp-ico-calculadora"></i></button></span>
  <span class="rp-label">Parcela (calculando)</span><span></span>
  <span class="rp-dinheiro rp-dinheiro--calc"><span class="rp-dinheiro-simbolo">R$</span><input class="rp-field rp-field--num rp-field--active" value="=23.579,23/3"><button class="rp-campo-icone" title="Calculadora"><i class="rp-ico rp-ico-calculadora"></i></button></span>
  <span class="rp-label">Saldo inicial (fixo)</span><span></span>
  <span class="rp-dinheiro"><span class="rp-dinheiro-simbolo">R$</span><input class="rp-field rp-field--num rp-field--readonly" readonly value="7.859,74"><button class="rp-campo-icone" title="Calculadora" disabled><i class="rp-ico rp-ico-calculadora"></i></button></span>
</div>
<div style="color:var(--ink-muted);margin-top:10px">Digite "=" no campo (ou clique na calculadora) para abrir a conta; Enter põe o resultado, Esc cancela.</div>
</body></html>
