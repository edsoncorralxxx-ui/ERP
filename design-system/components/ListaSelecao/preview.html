<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ListaSelecao</title>
<style>body{margin:0;padding:16px;background:var(--surface-form)}</style></head>
<body class="rp">
<div class="rp-lista-dupla" style="width:520px">
  <div>
    <div style="color:var(--ink-muted);margin-bottom:4px">Colunas disponíveis</div>
    <div class="rp-lista rp-rolagem" style="height:180px">
      <div>Centro de custo</div><div>Condição de pagamento</div><div aria-selected="true">Data de entrega</div>
      <div>Depósito</div><div>Lucro bruto</div><div>Projeto</div><div>Representante</div><div>Unidade de medida</div>
    </div>
  </div>
  <div class="rp-lista-mover">
    <button class="rp-btn" title="Adicionar">&rsaquo;</button>
    <button class="rp-btn" title="Adicionar todas">&raquo;</button>
    <button class="rp-btn" title="Remover">&lsaquo;</button>
    <button class="rp-btn" title="Remover todas">&laquo;</button>
  </div>
  <div>
    <div style="color:var(--ink-muted);margin-bottom:4px">Colunas exibidas</div>
    <div class="rp-lista rp-rolagem" style="height:180px">
      <div>Nº do item</div><div>Descrição</div><div>Quantidade</div><div>Preço unitário</div><div>Desconto %</div><div>Total da linha</div>
    </div>
  </div>
</div>
</body></html>
