<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Barra de progresso</title>
<style>body{margin:0;padding:16px;background:var(--surface-form)}</style></head>
<body class="rp">
<div style="display:grid;gap:10px;width:640px">
 <div class="rp-progress-row"><span>Importando lançamentos</span><div class="rp-progress" role="progressbar" aria-valuenow="64"><span style="width:64%"></span></div><b>64%</b></div>
 <div class="rp-progress-row"><span>Análise de IA do estoque</span><div class="rp-progress" role="progressbar" aria-valuenow="30"><span style="width:30%"></span></div><b>30%</b></div>
 <div class="rp-progress-row"><span>Fechamento do período</span><div class="rp-progress rp-progress--ok" role="progressbar" aria-valuenow="100"><span style="width:100%"></span></div><b>100%</b></div>
</div>
</body></html>
