<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>BarraFiltros</title>
<style>body{margin:0;padding:16px;background:var(--surface-form)}</style></head>
<body class="rp">
<div style="width:840px">
  <div class="rp-filtros">
    <label>Período <span class="rp-campo" style="width:110px"><input class="rp-field" value="01/09/2026"></span></label>
    <label>até <span class="rp-campo" style="width:110px"><input class="rp-field" value="30/09/2026"></span></label>
    <label>Status <span class="rp-select" style="width:120px"><select class="rp-field"><option>Abertos</option><option>Todos</option></select></span></label>
    <label>Cliente <input class="rp-field" placeholder="Código ou nome"></label>
    <button class="rp-btn rp-btn--default">Aplicar</button>
    <button class="rp-btn">Limpar</button>
    <div class="rp-filtros-dir">
      <span class="rp-chip"><b>Filial:</b> Matriz <i class="x" title="Remover">&times;</i></span>
      <span class="rp-chip"><b>Vendedor:</b> Ana Lúcia <i class="x" title="Remover">&times;</i></span>
    </div>
  </div>
</div>
</body></html>
