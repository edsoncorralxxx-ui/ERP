name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  especificacao:
    name: Especificação (B01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/b01/formatar_json.py --verificar
      - run: python3 tools/b01/verificar_b01.py
      - run: python3 -m unittest discover -s tools/b01

  servidor:
    name: Servidor Java (testes com PostgreSQL real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers sobe o PostgreSQL 16 no Docker do runner.
      - run: ./mvnw -B verify

  app:
    name: App do Mac (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
