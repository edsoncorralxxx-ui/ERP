name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  especificacao:
    name: Especificação (B01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/b01/formatar_json.py --verificar
      - run: python3 tools/b01/verificar_b01.py
      - run: python3 -m unittest discover -s tools/b01

  servidor:
    name: Servidor Java (testes com PostgreSQL real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers sobe o PostgreSQL 16 no Docker do runner.
      - run: ./mvnw -B verify

  app:
    name: App do Mac (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Roteiro de ponta a ponta (Playwright contra o servidor real)
    runs-on: ubuntu-latest
    needs: [servidor, app]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renda
          POSTGRES_PASSWORD: renda
          POSTGRES_DB: renda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renda" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      RENDA_E2E_USER: admin
      RENDA_E2E_PASSWORD: senha-e2e-renda-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Servidor (banco vazio, administrador inicial)
        working-directory: backend/java
        run: |
          ./mvnw -B -q -DskipTests package
          RENDA_BOOTSTRAP_ADMIN_USER="$RENDA_E2E_USER" RENDA_BOOTSTRAP_ADMIN_PASSWORD="$RENDA_E2E_PASSWORD" \
            nohup java -jar target/renda-erp-server-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/status && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/servidor.log"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Roteiros das sprints no Chromium
        working-directory: apps/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/evidencias"
          RENDA_E2E_EVIDENCIAS="$RUNNER_TEMP/evidencias" npm run e2e
      - name: Evidências e log do servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidencias
          path: |
            ${{ runner.temp }}/evidencias
            ${{ runner.temp }}/servidor.log
          if-no-files-found: ignore
