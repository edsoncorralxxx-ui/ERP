        '200': { description: Recebimentos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Settlement' } } } } }
    post:
      tags: [Recebimentos]
      summary: >-
        Registra um recebimento ou um pagamento — PostSettlement (financial_title.settle). Na mesma transação: bloqueia os títulos em
        ordem de id, aplica cada alocação contra o saldo, cria a entrada (recebimento) ou a saída (pagamento) na conta, grava
        auditoria e o evento SettlementPosted. Título de outra direção: 422 SETTLEMENT_DIRECTION_MISMATCH
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettlementRequest' } } }
      responses:
        '201': { description: Recebimento registrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/settlements/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
