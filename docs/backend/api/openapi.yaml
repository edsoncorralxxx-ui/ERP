        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Origem ou destino' }
      responses:
        '200': { description: Transferências, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transfer' } } } } }
    post:
      tags: [Transferências]
      summary: >-
        Transfere entre contas próprias — TransferBetweenAccounts (transfer.post): saída na origem e entrada no destino, com o
        mesmo valor e data; contas ativas e diferentes; data não futura; evento TransferPosted
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferRequest' } } }
      responses:
        '201': { description: Transferência registrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
