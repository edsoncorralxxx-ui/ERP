      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installments]
              properties:
                installments: { type: array, items: { $ref: '#/components/schemas/Installment' } }
                reason: { type: [string, 'null'], maxLength: 500 }
