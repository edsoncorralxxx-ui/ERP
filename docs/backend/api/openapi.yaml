  /api/v1/settlements:
    get:
      tags: [Recebimentos]
      summary: Recebimentos e pagamentos, os mais recentes primeiro (financial_title.read)
      parameters:
        - { name: titleId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Só os que alocam neste título' }
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
