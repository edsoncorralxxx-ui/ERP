    post:
      tags: [Recebimentos]
      summary: >-
        Estorna o recebimento ou o pagamento inteiro — ReverseSettlement (settlement.reverse), com motivo obrigatório (PD-005).
        Devolve o saldo aos mesmos títulos e cria o movimento inverso na conta; já estornado devolve o estorno existente (INV-ST-6)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Recebimento estornado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

