    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Pedidos]
      summary: >-
        Altera as parcelas do pedido confirmado (sales_order.update; decisão do PO em 10/10/2026, sem aditivo). A soma precisa
        ser o total; os títulos a receber acompanham (vencimento e valor; parcela nova cria título, a que sai é cancelada).
        Rascunho ou cancelado: 409. Título com recebimento acima do novo valor, nota vinculada com valor diferente ou recebimento
