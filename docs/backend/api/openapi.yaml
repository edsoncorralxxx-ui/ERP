      responses:
        '201': { description: Categoria cadastrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialCategory' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/financial-categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categorias financeiras]
      summary: Categoria (financial_title.read)
      responses:
        '200': { description: Categoria, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialCategory' } } } }
        '404': { $ref: '#/components/responses/Erro' }
