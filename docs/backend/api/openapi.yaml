  /api/v1/bank-accounts/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Contas financeiras]
      summary: Trilha da conta (financial_title.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bank-accounts/balances:
    get:
      tags: [Contas financeiras]
      summary: Saldo realizado de cada conta e o total numa data — IND-009 (financial_title.read); transferências se anulam no total
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date }, description: 'Padrão: hoje' }
      responses:
        '200':
          description: Saldos
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  totalCents: { $ref: '#/components/schemas/Cents' }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        status: { type: string, enum: [ATIVO, INATIVO] }
                        balanceCents: { type: string }

