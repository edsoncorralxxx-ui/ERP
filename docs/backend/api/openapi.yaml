      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FinancialCategoryRequest' } } }
      responses:
        '200': { description: Categoria alterada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialCategory' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/financial-categories/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categorias financeiras]
      summary: Trilha da categoria (financial_title.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/settlements:
    get:
      tags: [Recebimentos]
      summary: Recebimentos e pagamentos, os mais recentes primeiro (financial_title.read)
      parameters:
        - { name: titleId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Só os que alocam neste título' }
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Recebimentos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Settlement' } } } } }
    post:
      tags: [Recebimentos]
      summary: >-
        Registra um recebimento ou um pagamento — PostSettlement (financial_title.settle). Na mesma transação: bloqueia os títulos em
        ordem de id, aplica cada alocação contra o saldo, cria a entrada (recebimento) ou a saída (pagamento) na conta, grava
        auditoria e o evento SettlementPosted. Título de outra direção: 422 SETTLEMENT_DIRECTION_MISMATCH
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettlementRequest' } } }
      responses:
        '201': { description: Recebimento registrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/settlements/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Recebimentos]
      summary: Recebimento com as alocações e o estorno, se houver (financial_title.read)
      responses:
        '200': { description: Recebimento, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/settlements/{id}/reversals:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Recebimentos]
      summary: >-
        Estorna o recebimento ou o pagamento inteiro — ReverseSettlement (settlement.reverse), com motivo obrigatório (PD-005).
        Devolve o saldo aos mesmos títulos e cria o movimento inverso na conta; já estornado devolve o estorno existente (INV-ST-6)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Recebimento estornado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settlement' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/settlements/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Recebimentos]
      summary: Trilha do recebimento (financial_title.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bank-accounts:
    get:
      tags: [Contas financeiras]
      summary: Caixa e contas bancárias com o saldo atual (financial_title.read)
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Contas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BankAccount' } } } } }
    post:
      tags: [Contas financeiras]
      summary: Cadastra uma conta (bank_account.admin); nome único; banco obrigatório no tipo BANCO
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountRequest' } } }
      responses:
        '201': { description: Conta cadastrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/bank-accounts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Contas financeiras]
      summary: Conta com o saldo (financial_title.read)
      responses:
        '200': { description: Conta, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [Contas financeiras]
      summary: Altera ou inativa (bank_account.admin); saldo inicial e data não mudam depois do primeiro movimento
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BankAccountRequest' } } }
      responses:
        '200': { description: Conta alterada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BankAccount' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/bank-accounts/{id}/movements:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Contas financeiras]
      summary: Extrato — movimentos da conta com o saldo acumulado (financial_title.read)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: Movimentos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CashMovement' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bank-accounts/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Contas financeiras]
      summary: Trilha da conta (financial_title.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bank-accounts/balances:
    get:
      tags: [Contas financeiras]
      summary: Saldo realizado de cada conta e o total numa data — IND-009 (financial_title.read); transferências se anulam no total
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date }, description: 'Padrão: hoje' }
      responses:
        '200':
          description: Saldos
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  totalCents: { $ref: '#/components/schemas/Cents' }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId: { type: string, format: uuid }
                        code: { type: string }
                        name: { type: string }
                        status: { type: string, enum: [ATIVO, INATIVO] }
                        balanceCents: { type: string }

  /api/v1/transfers:
    get:
      tags: [Transferências]
      summary: Transferências, as mais recentes primeiro (financial_title.read)
      parameters:
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Origem ou destino' }
      responses:
        '200': { description: Transferências, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transfer' } } } } }
    post:
      tags: [Transferências]
      summary: >-
        Transfere entre contas próprias — TransferBetweenAccounts (transfer.post): saída na origem e entrada no destino, com o
        mesmo valor e data; contas ativas e diferentes; data não futura; evento TransferPosted
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferRequest' } } }
      responses:
        '201': { description: Transferência registrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/transfers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Transferências]
      summary: Transferência (financial_title.read)
      responses:
        '200': { description: Transferência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/transfers/{id}/reversals:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Transferências]
      summary: >-
        Estorna a transferência inteira (transfer.post), com motivo: os dois movimentos inversos, com a data de hoje; já estornada
        devolve a mesma; evento TransferReversed
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Transferência estornada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/transfers/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Transferências]
      summary: Trilha da transferência (financial_title.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/cash-flow:
    get:
      tags: [Fluxo de caixa]
      summary: >-
        Fluxo de caixa mês a mês (financial_title.read): mês passado só realizado; corrente com realizado até hoje, em atraso e
        previsto até o fim do mês; futuro previsto. Saldo final = inicial + entradas − saídas e é o inicial do mês seguinte.
        Filtro de conta recorta o realizado e o saldo inicial; filtro de categoria mostra só o fluxo da categoria (saldo inicial zero)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, example: '2026-07' }, description: 'AAAA-MM; padrão: 3 meses antes do atual' }
        - { name: to, in: query, required: false, schema: { type: string, example: '2027-03' }, description: 'AAAA-MM; padrão: 6 meses depois; até 24 meses' }
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { type: string, example: SERVICOS_TERCEIROS } }
      responses:
        '200': { description: Fluxo, content: { application/json: { schema: { $ref: '#/components/schemas/CashFlow' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/cash-flow/composition:
    get:
      tags: [Fluxo de caixa]
      summary: Movimentos ou títulos que formam um valor do fluxo; a soma é o valor da grade (financial_title.read)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, example: '2026-10' } }
        - name: column
          in: query
          required: true
          schema: { type: string, enum: [OPENING, REALIZED_IN, REALIZED_OUT, OVERDUE_IN, OVERDUE_OUT, FORECAST_IN, FORECAST_OUT] }
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Composição, content: { application/json: { schema: { $ref: '#/components/schemas/CashFlowComposition' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents:
    get:
      tags: [Documentos e faturamento]
      summary: Documentos, os mais recentes primeiro (document.read)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código, número ou cliente' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ATIVOS, CANCELADOS, TODOS], default: ATIVOS } }
        - { name: competence, in: query, required: false, schema: { type: string, example: '2026-09' } }
        - { name: customerId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Documentos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BusinessDocument' } } } } }
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Registra a nota de saída do pedido, emitida fora do Renda+ — RegisterDocument (document.register e document.link). Valor =
        recebido sem nota do pedido (ou o informado, até ele); linhas proporcionais às do pedido e vínculos pela ordem de vencimento,
        com as parcelas bloqueadas. Número único por cliente e série entre as notas ativas (422 DOCUMENT_DUPLICATE); evento DocumentRegistered
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } }
      responses:
        '201': { description: Documento registrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Documentos e faturamento]
      summary: Documento com linhas e vínculos (document.read)
      responses:
        '200': { description: Documento, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/links:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Vincula parcelas — LinkDocumentToTitles (document.link), para refazer um vínculo desfeito. Bloqueia o documento e as parcelas
        em ordem de id; parcela do mesmo cliente, não cancelada, uma vez por documento, até o recebido sem nota; evento DocumentLinkedToTitles
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [links], properties: { links: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DocumentLinkRequest' } } } } } }
      responses:
        '200': { description: Documento com os vínculos, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/links/{linkId}/removals:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Desfaz um vínculo, com motivo (document.link); o valor volta ao a faturar da parcela; já desfeito devolve o documento;
        evento DocumentLinkRemoved
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Vínculo desfeito, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/cancellations:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Cancela o documento com motivo — CancelDocument (document.cancel); desfaz todos os vínculos; o documento continua
        consultável; cancelar de novo devolve o cancelamento existente; evento DocumentCancelled
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Documento cancelado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/classification:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Documentos e faturamento]
      summary: >-
        Classifica — ClassifyDocument (document.classify): natureza da operação e projeto (de uma parcela vinculada); cada
        reclassificação é uma nova revisão; evento DocumentClassified
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentClassificationRequest' } } }
      responses:
        '200': { description: Documento classificado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Documentos e faturamento]
      summary: Trilha do documento (document.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/invoicing:
    get:
      tags: [Documentos e faturamento]
      summary: >-
        Faturado por parcela, com as notas vinculadas (document.read): as parcelas não canceladas do cliente (`customerId`) ou as
        indicadas (`titleId`, repetível). A faturar = valor − faturado (IND-003); a emitir = recebido − faturado (regime de caixa)
      parameters:
        - { name: customerId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: titleId, in: query, required: false, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
      responses:
        '200': { description: Parcelas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TitleInvoicing' } } } } }

  /api/v1/invoicing/orders:
    get:
      tags: [Documentos e faturamento]
      summary: >-
        Notas a emitir pelo caixa (document.read): pedidos confirmados com recebido, faturado, a emitir e a divisão do a emitir
        entre produto e serviço; `status` A_EMITIR (padrão, só com recebimento sem nota) ou TODOS
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Número do pedido ou cliente' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [A_EMITIR, TODOS], default: A_EMITIR } }
      responses:
        '200': { description: Pedidos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderInvoicing' } } } } }

  /api/v1/invoicing/orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Documentos e faturamento]
      summary: >-
        Um pedido pelo caixa com a nota proposta (document.read): linhas e parcelas para `amountCents` (o a emitir, se vazio);
        acima do a emitir, 422 DOCUMENT_EXCEEDS_RECEIVED
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [PRODUTO, SERVICO] }, description: 'Tipo da nota proposta; Produto, se houver produto a emitir' }
        - { name: amountCents, in: query, required: false, schema: { $ref: '#/components/schemas/Cents' } }
      responses:
        '200': { description: Pedido, content: { application/json: { schema: { $ref: '#/components/schemas/OrderInvoicing' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods:
    get:
      tags: [Impostos gerenciais]
      summary: >-
        Competências do ano, de janeiro a dezembro (tax.read): receita de produto e de serviço das notas ativas, última simulação,
        último valor do contador e a diferença (contador − simulação)
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer, example: 2026 }, description: 'Padrão: o ano corrente' }
      responses:
        '200': { description: Competências, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxPeriodSummary' } } } } }

  /api/v1/tax-periods/{competence}:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    get:
      tags: [Impostos gerenciais]
      summary: Ficha da competência (tax.read) — receita, notas, RBT12, parâmetros vigentes, simulações, conferências e fechamentos
      responses:
        '200': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/rbt12:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    put:
      tags: [Impostos gerenciais]
      summary: Informa o RBT12 que o contador usou no PGDAS-D (tax_period.confirm); nova versão da competência
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxRbt12Request' } } }
      responses:
        '200': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/simulations:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Impostos gerenciais]
      summary: >-
        Simula a competência — RecordTaxSimulation (tax_period.simulate), com os parâmetros vigentes e o RBT12 calculado (12 meses
        conhecidos) ou informado; sem eles, resultado NAO_CALCULAVEL com o motivo. Cada simulação é preservada; evento TaxSimulationRecorded
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Competência com a nova simulação, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/confirmations:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Impostos gerenciais]
      summary: >-
        Registra o valor apurado pelo contador e o vencimento — ConfirmTaxPeriod (tax_period.confirm); a anterior fica no histórico.
        Na mesma transação cria o título a pagar do DAS (valor, vencimento e competência da conferência; beneficiário Receita
        Federal — DAS; categoria IMPOSTOS_SIMPLES). Reconferir cancela o DAS anterior sem pagamento e cria outro; DAS com pagamento:
        422 TAX_DAS_PAID; valor zero não cria título. Evento TaxPeriodConfirmed com o titleId
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxConfirmationRequest' } } }
      responses:
        '201': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/closures:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Impostos gerenciais]
      summary: >-
        Fecha a competência conferida (tax_period.close): congela receita, simulação e conferência; notas dessa competência não são
        registradas nem canceladas (TAX_PERIOD_CLOSED). Sem conferência: 422 TAX_PERIOD_INVALID. Fechar de novo devolve a mesma; evento TaxPeriodClosed
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: Competência fechada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/reopenings:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Impostos gerenciais]
      summary: Reabre a competência fechada, com motivo (tax_period.reopen); competência aberta → 409; evento TaxPeriodReopened
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { description: Competência reaberta, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/history:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    get:
      tags: [Impostos gerenciais]
      summary: Trilha da competência (tax.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/tax-parameters:
    get:
      tags: [Impostos gerenciais]
      summary: Revisões dos parâmetros do Simples Nacional, da mais recente para a mais antiga (tax.read)
      responses:
        '200': { description: Revisões, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxParameters' } } } } }
    post:
      tags: [Impostos gerenciais]
      summary: >-
        Nova revisão dos parâmetros, com vigência (tax_parameter.admin). Faixas crescentes por tipo, alíquota entre 0 e 1; a revisão
        gravada não muda. Inválida: 422 TAX_PARAMETER_INVALID; evento TaxParameterRevised
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxParametersRequest' } } }
      responses:
        '201': { description: Revisão criada, content: { application/json: { schema: { $ref: '#/components/schemas/TaxParameters' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models:
    get:
      tags: [Modelos de equipamento]
      summary: Modelos com a quantidade de equipamentos de cada um (bom.read)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código ou nome' }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Modelos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentModel' } } } } }
    post:
      tags: [Modelos de equipamento]
      summary: Cadastra o modelo (bom.update); nome único sem diferenciar maiúsculas (422 EQUIPMENT_MODEL_DUPLICATE); evento EquipmentModelRegistered
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModelRequest' } } }
      responses:
        '201': { description: Modelo cadastrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Modelos de equipamento]
      summary: Modelo (bom.read)
      responses:
        '200': { description: Modelo, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [Modelos de equipamento]
      summary: Renomeia o modelo (bom.update); os equipamentos continuam com o texto do pedido; evento EquipmentModelUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModelRequest' } } }
      responses:
        '200': { description: Modelo alterado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Modelos de equipamento]
      summary: Inativa o modelo com motivo (bom.update); equipamentos e BOMs existentes continuam
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Modelo inativo, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Modelos de equipamento]
      summary: Trilha do modelo (bom.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/boms:
    get:
      tags: [BOM]
      summary: BOMs (as dos modelos primeiro, depois as submontagens), com a revisão aprovada e o rascunho (bom.read)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código, nome da BOM ou do modelo' }
      responses:
        '200': { description: BOMs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bom' } } } } }
    post:
      tags: [BOM]
      summary: >-
        Cadastra a BOM — CreateBom (bom.update): de um modelo (uma por modelo) ou submontagem (sem modelo); nasce com a revisão 00
        em rascunho, sem linhas. Nome único (422 BOM_DUPLICATE)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomRequest' } } }
      responses:
        '201': { description: BOM cadastrada, content: { application/json: { schema: { $ref: '#/components/schemas/Bom' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/boms/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: BOM com a revisão aprovada e o rascunho (bom.read)
      responses:
        '200': { description: BOM, content: { application/json: { schema: { $ref: '#/components/schemas/Bom' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/boms/{id}/revisions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BOM]
      summary: >-
        Revisão nova em rascunho — CreateBomRevision (bom.update), cópia das linhas da revisão aprovada; só um rascunho por BOM
        (422 BOM_DRAFT_EXISTS)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Rascunho criado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BomRevision' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/boms/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: Trilha da BOM e das revisões (bom.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/bom-revisions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: >-
        Revisão com as linhas, o valor de cada uma, subtotais por categoria, total, pendências e problemas, quem a usa como submontagem
        e as revisões da BOM (bom.read)
      responses:
        '200': { description: Revisão, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BomRevision' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [BOM]
      summary: >-
        Grava o rascunho inteiro — UpdateBomDraft (bom.update): linhas na ordem e total informado da origem. Revisão aprovada: 409.
        Item inexistente, quantidade ≤ 0, custo negativo: 422 BOM_INVALID; ciclo de submontagens: 422 BOM_CYCLE
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomDraftRequest' } } }
      responses:
        '200': { description: Rascunho gravado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BomRevision' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-revisions/{id}/approval:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BOM]
      summary: >-
        Aprova — ApproveBomRevision (bom.approve): a revisão e as submontagens em rascunho abaixo dela, juntas; a aprovada antes fica
        substituída. Pendência: 422 BOM_INCOMPLETE com cada linha em details. Aprovada de novo: devolve a mesma. Evento BomRevisionApproved
      responses:
        '200': { description: Revisão aprovada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BomRevision' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-revisions/{id}/comparison:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: Linhas incluídas, retiradas e alteradas entre a revisão `with` (antes) e esta (depois), e a variação do total (bom.read)
      parameters:
        - { name: with, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Comparação, content: { application/json: { schema: { $ref: '#/components/schemas/BomComparison' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-imports:
    post:
      tags: [BOM]
      summary: >-
        Envia o arquivo JSON da BOM e devolve a prévia (bom.update): linhas, submontagens, totais, itens e unidades novos, códigos
        gerados e problemas da origem, sem gravar nada além do arquivo. O mesmo arquivo devolve a mesma carga
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomImportRequest' } } }
      responses:
        '201': { description: Prévia, content: { application/json: { schema: { $ref: '#/components/schemas/BomImport' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-imports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: Carga e a prévia (bom.read)
      responses:
        '200': { description: Carga, content: { application/json: { schema: { $ref: '#/components/schemas/BomImport' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-imports/{id}/confirmation:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BOM]
      summary: >-
        Confirma a carga — ImportBom (bom.update): modelo, BOM do modelo, submontagens com a revisão em rascunho e itens novos, numa
        transação; confirmar de novo devolve a mesma. BOM com rascunho aberto: 422 BOM_DRAFT_EXISTS. Evento BomImported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Carga confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/BomImport' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment/{id}/bom:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM do equipamento]
      summary: BOM do equipamento em árvore, com o estado de cada linha em relação ao modelo; `applied` falso se ainda não tem (bom.read)
      responses:
        '200': { description: BOM do equipamento, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBom' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    post:
      tags: [BOM do equipamento]
      summary: >-
        Aplica a revisão aprovada de uma BOM de modelo — ApplyBomToProject (project_bom.apply): cópia congelada; a mesma revisão de novo
        não muda nada; outra revisão exige motivo e descarta os ajustes. Rascunho: 422 BOM_NOT_APPROVED. Evento ProjectBomApplied
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBomApplyRequest' } } }
      responses:
        '200': { description: BOM aplicada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBom' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment/{id}/bom/adjustments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BOM do equipamento]
      summary: >-
        Ajusta só este equipamento — AdjustEquipmentBom (project_bom.apply), com motivo: incluir (ADD), alterar quantidade ou custo
        (UPDATE), retirar (REMOVE) ou devolver (RESTORE) uma linha. O modelo não muda. Evento EquipmentBomAdjusted
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBomAdjustRequest' } } }
      responses:
        '200': { description: BOM ajustada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBom' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment/{id}/bom/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM do equipamento]
      summary: Trilha da BOM do equipamento (bom.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/projects/{id}/planned-cost:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM do equipamento]
      summary: >-
        Custo planejado do projeto (project.read e bom.read): soma das BOMs dos equipamentos ativos, valor contratado e margem prevista;
        equipamento sem BOM aparece sem custo, e a margem só sai quando todos têm BOM sem pendência
      responses:
        '200': { description: Custo planejado, content: { application/json: { schema: { $ref: '#/components/schemas/PlannedCost' } } } }
        '404': { $ref: '#/components/responses/Erro' }

components:
  securitySchemes:
    sessao:
      type: http
      scheme: bearer
      description: Token opaco devolvido por POST /api/v1/session
  headers:
    ETag:
      description: Versão do registro entre aspas, para usar no If-Match
      schema: { type: string, example: '"3"' }
  parameters:
    Id:
      { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch:
      { name: If-Match, in: header, required: true, schema: { type: string, example: '"3"' }, description: 'Versão lida (ETag)' }
    IdempotencyKey:
      { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' } }
    Competence:
      { name: competence, in: path, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-09' } }
  responses:
    Erro:
      description: Erro padronizado
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    ApiError:
      type: object
      properties:
        code: { type: string, example: VERSION_MISMATCH }
        message: { type: string }
        details: { type: array, items: { type: object, properties: { field: { type: [string, 'null'] }, message: { type: string } } } }
        correlationId: { type: string }
        retryable: { type: boolean }
    Profile:
      type: string
      enum: [ADMINISTRADOR, CONSULTA]
    SessionUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        profile: { $ref: '#/components/schemas/Profile' }
        profileLabel: { type: string, example: Administrador }
        permissions: { type: array, items: { type: string }, example: [company.read, partner.read] }
    UserAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        profile: { $ref: '#/components/schemas/Profile' }
        active: { type: boolean }
        locked: { type: boolean }
        version: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    Address:
      type: object
      properties:
        street: { type: [string, 'null'] }
        number: { type: [string, 'null'] }
        complement: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        state: { type: [string, 'null'], description: UF }
        postalCode: { type: [string, 'null'], description: '8 dígitos' }
    CompanyProfileRequest:
      type: object
      properties:
        legalName: { type: string }
        tradeName: { type: [string, 'null'] }
        cnpj: { type: [string, 'null'] }
        address: { $ref: '#/components/schemas/Address' }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
    CompanyProfile:
      allOf:
        - $ref: '#/components/schemas/CompanyProfileRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
            cnpjFormatted: { type: [string, 'null'] }
            configured: { type: boolean }
            version: { type: string }
            updatedAt: { type: [string, 'null'], format: date-time }
            updatedBy: { type: [string, 'null'] }
    Unit:
      type: object
      required: [name]
      properties:
        id: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 120 }
        street: { type: [string, 'null'] }
        number: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        postalCode: { type: [string, 'null'] }
        cnpj: { type: [string, 'null'], description: 'CNPJ da unidade (filial ou outro estabelecimento), opcional; na entrada aceita máscara, na saída só dígitos. Único entre os parceiros' }
        cnpjFormatted: { type: [string, 'null'], readOnly: true, example: '11.222.333/0002-62' }
    Contact:
      type: object
      required: [name]
      properties:
        id: { type: [string, 'null'], format: uuid }
        name: { type: string, maxLength: 120 }
        role: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
    CustomerRequest:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: [string, 'null'], maxLength: 200 }
        cnpj: { type: [string, 'null'], description: 'Com ou sem máscara; válido e único quando informado' }
        group: { type: [string, 'null'], maxLength: 100 }
        units: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Unit' } }
        contacts: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Contact' } }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string, example: C00001 }
            cnpjFormatted: { type: [string, 'null'] }
            status: { type: string, enum: [ATIVO, INATIVO], description: 'Situação do papel de cliente' }
            supplier: { type: boolean, description: 'Também é fornecedor ativo' }
            version: { type: string }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string }
            updatedAt: { type: [string, 'null'], format: date-time }
            updatedBy: { type: [string, 'null'] }
    CustomerSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        legalName: { type: string }
        tradeName: { type: [string, 'null'] }
        cnpjFormatted: { type: [string, 'null'] }
        city: { type: [string, 'null'], description: 'Cidade da primeira unidade' }
        state: { type: [string, 'null'] }
        units: { type: integer }
        status: { type: string, enum: [ATIVO, INATIVO] }
        version: { type: string }
    HistoryEntry:
      type: object
      properties:
        occurredAt: { type: string, format: date-time }
        actor: { type: string }
        action:
          type: string
          description: >-
            PARTNER_REGISTERED, PARTNER_UPDATED, PARTNER_DEACTIVATED, PARTNER_ROLE_ENABLED, ITEM_REGISTERED, ITEM_UPDATED,
            ITEM_DEACTIVATED, PROPOSAL_DRAFTED, PROPOSAL_UPDATED, PROPOSAL_REVISION_ISSUED, PROPOSAL_REVISION_CREATED,
            PROPOSAL_LOST, PROPOSAL_WON, SALES_ORDER_DRAFTED, SALES_ORDER_UPDATED, SALES_ORDER_CONFIRMED, SALES_ORDER_CANCELLED,
            PROJECT_CREATED, PROJECT_CLOSED, EQUIPMENT_CREATED, EQUIPMENT_UPDATED, EQUIPMENT_CANCELLED,
            EQUIPMENT_MODEL_REGISTERED, EQUIPMENT_MODEL_UPDATED, EQUIPMENT_MODEL_DEACTIVATED, BOM_CREATED, BOM_DRAFT_UPDATED,
            BOM_REVISION_CREATED, BOM_REVISION_APPROVED, BOM_IMPORTED, EQUIPMENT_BOM_APPLIED, EQUIPMENT_BOM_REVISION_CHANGED,
            EQUIPMENT_BOM_ADJUSTED
        version: { type: integer }
        reason: { type: [string, 'null'] }
        changes:
          type: object
          additionalProperties:
            type: object
            properties:
              before: { type: [string, 'null'] }
              after: { type: [string, 'null'] }
    CategoryRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    SupplierRequest:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string, maxLength: 200 }
        tradeName: { type: [string, 'null'], maxLength: 200 }
        cnpj: { type: [string, 'null'], description: 'Com ou sem máscara; válido e único quando informado' }
        group: { type: [string, 'null'], maxLength: 100 }
        leadTimeDays: { type: [integer, 'null'], minimum: 0, maximum: 365, description: 'Prazo de referência de entrega' }
        paymentTerms: { type: [string, 'null'], maxLength: 200 }
        suppliedCategoryIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        contacts: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Contact' } }
    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: F00001, description: 'Código do parceiro; um cliente que vira fornecedor mantém o código C' }
        legalName: { type: string }
        tradeName: { type: [string, 'null'] }
        cnpj: { type: [string, 'null'] }
        cnpjFormatted: { type: [string, 'null'] }
        group: { type: [string, 'null'] }
        status: { type: string, enum: [ATIVO, INATIVO], description: 'Situação do papel de fornecedor' }
        customer: { type: boolean, description: 'Também é cliente ativo' }
        leadTimeDays: { type: [integer, 'null'] }
        paymentTerms: { type: [string, 'null'] }
        suppliedCategories: { type: array, items: { $ref: '#/components/schemas/CategoryRef' } }
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    SupplierSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        legalName: { type: string }
        tradeName: { type: [string, 'null'] }
        cnpjFormatted: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        suppliedCategories: { type: [string, 'null'], description: 'Nomes separados por vírgula' }
        leadTimeDays: { type: [integer, 'null'] }
        status: { type: string, enum: [ATIVO, INATIVO] }
        version: { type: string }
    Conversion:
      type: object
      required: [fromUom, factor]
      properties:
        id: { type: [string, 'null'], format: uuid }
        fromUom: { type: string, description: 'Unidade de compra' }
        factor: { type: string, example: '6', description: '1 fromUom = factor unidades do item; maior que zero, até 6 casas' }
    ItemRequest:
      type: object
      required: [description, nature, uom, categoryId, stockControlled]
      properties:
        description: { type: string, maxLength: 200 }
        nature: { type: string, enum: [MATERIAL, SERVICO], description: 'MATERIAL = produto (na tela: Produto)' }
        uom: { type: string, description: 'Código de unidade ativa' }
        categoryId: { type: string, format: uuid }
        stockControlled: { type: boolean, description: 'Serviço nunca controla estoque' }
        referenceCost: { type: [string, 'null'], example: '184.50', description: 'BRL por unidade do item; maior ou igual a zero, até 6 casas' }
        ncm: { type: [string, 'null'], example: '84239029', description: 'Só produto (nature MATERIAL): 8 dígitos; aceita 8423.90.29 na entrada' }
        serviceCode: { type: [string, 'null'], example: '14.01', description: 'Só serviço: item da lista da LC 116/2003 (COD_LST do registro 0200 do SPED); aceita 1401 na entrada' }
        conversions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Conversion' } }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: P00001 }
        description: { type: string }
        nature: { type: string, enum: [MATERIAL, SERVICO] }
        uom: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        stockControlled: { type: boolean }
        referenceCost: { type: [string, 'null'], example: '184.500000' }
        ncm: { type: [string, 'null'], example: '84239029', description: 'Só produto (nature MATERIAL): 8 dígitos; aceita 8423.90.29 na entrada' }
        serviceCode: { type: [string, 'null'], example: '14.01', description: 'Só serviço: item da lista da LC 116/2003 (COD_LST do registro 0200 do SPED); aceita 1401 na entrada' }
        status: { type: string, enum: [ATIVO, INATIVO] }
        conversions: { type: array, items: { $ref: '#/components/schemas/Conversion' } }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    ItemSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        nature: { type: string, enum: [MATERIAL, SERVICO] }
        uom: { type: string }
        category: { type: string }
        stockControlled: { type: boolean }
        referenceCost: { type: [string, 'null'] }
        ncm: { type: [string, 'null'] }
        serviceCode: { type: [string, 'null'] }
        status: { type: string, enum: [ATIVO, INATIVO] }
        version: { type: string }
    UnitOfMeasure:
      type: object
      properties:
        code: { type: string, example: KG }
        name: { type: string }
        status: { type: string, enum: [ATIVO, INATIVO] }
        version: { type: string }
        items: { type: integer, description: 'Itens que usam a unidade' }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    ItemCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ATIVO, INATIVO] }
        version: { type: string }
        items: { type: integer }
        suppliers: { type: integer, description: 'Fornecedores que a fornecem' }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    Cents:
      type: string
      pattern: '^\d{1,18}$'
      description: Valor em centavos, texto de inteiro ("30207146" = R$ 302.071,46)
    SalesLineRequest:
      type: object
      required: [kind, quantity, unitPrice]
      properties:
        id: { type: [string, 'null'], description: 'Id da linha existente; vazio numa linha nova' }
        kind: { type: string, enum: [EQUIPAMENTO, MATERIAL, SERVICO] }
        itemId: { type: [string, 'null'], format: uuid, description: 'Obrigatório para MATERIAL e SERVICO (mesma natureza); vazio para EQUIPAMENTO' }
        description: { type: [string, 'null'], maxLength: 200, description: 'Modelo do equipamento; nos itens, a descrição do cadastro quando vazio' }
        quantity: { type: string, example: '10.5', description: 'Até 6 casas; equipamento em unidades inteiras (1 a 100)' }
        unitPrice: { type: string, example: '16.33', description: 'Preço unitário em reais, até 6 casas' }
        discountCents: { type: [string, 'null'], example: '10000' }
    SalesLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [EQUIPAMENTO, MATERIAL, SERVICO] }
        itemId: { type: [string, 'null'], format: uuid }
        itemCode: { type: [string, 'null'] }
        description: { type: string }
        quantity: { type: string }
        uom: { type: string }
        unitPrice: { type: string }
        discountCents: { $ref: '#/components/schemas/Cents' }
        grossCents: { $ref: '#/components/schemas/Cents' }
        totalCents: { $ref: '#/components/schemas/Cents', description: 'round(quantidade × preço) − desconto, meio-par por linha (PD-002)' }
    ProposalRequest:
      type: object
      required: [customerId, title, validUntil, lines]
      properties:
        customerId: { type: string, format: uuid }
        unitId: { type: [string, 'null'], format: uuid }
        title: { type: string, maxLength: 200 }
        validUntil: { type: string, format: date }
        paymentTerms: { type: [string, 'null'], maxLength: 500 }
        lines: { type: array, items: { $ref: '#/components/schemas/SalesLineRequest' } }
    ProposalRevision:
      type: object
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer }
        status: { type: string, enum: [RASCUNHO, EMITIDA] }
        validUntil: { type: string, format: date }
        paymentTerms: { type: [string, 'null'] }
        totalCents: { $ref: '#/components/schemas/Cents' }
        issuedAt: { type: [string, 'null'], format: date-time }
        issuedBy: { type: [string, 'null'] }
        lines: { type: array, items: { $ref: '#/components/schemas/SalesLine' } }
    Proposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PR00001 }
        customerId: { type: string, format: uuid }
        customerCode: { type: string }
        customerName: { type: string }
        unitId: { type: [string, 'null'], format: uuid }
        unitName: { type: [string, 'null'] }
        title: { type: string }
        status: { type: string, enum: [ABERTA, GANHA, PERDIDA] }
        outcomeReason: { type: [string, 'null'] }
        currentRevision: { type: integer }
        revisions: { type: array, items: { $ref: '#/components/schemas/ProposalRevision' } }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    ProposalSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        customerCode: { type: string }
        customerName: { type: string }
        unitName: { type: [string, 'null'] }
        title: { type: string }
        status: { type: string, enum: [ABERTA, GANHA, PERDIDA] }
        revision: { type: integer }
        revisionStatus: { type: string, enum: [RASCUNHO, EMITIDA] }
        validUntil: { type: string, format: date }
        totalCents: { $ref: '#/components/schemas/Cents' }
        version: { type: string }
    OutcomeRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [PERDIDA] }
        reason: { type: string, maxLength: 500 }
    ConvertRequest:
      type: object
      properties:
        unitId: { type: [string, 'null'], format: uuid, description: 'Obrigatória se a proposta não tem unidade' }
        contractDate: { type: [string, 'null'], format: date, description: 'Hoje quando vazia' }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    Installment:
      type: object
      required: [dueDate, amountCents]
      properties:
        seq: { type: [integer, 'null'], description: 'Na resposta: sequência a partir de 1 (a ordem da lista)' }
        dueDate: { type: string, format: date }
        amountCents: { $ref: '#/components/schemas/Cents' }
        milestone: { type: [string, 'null'], maxLength: 200 }
    SalesOrderRequest:
      type: object
      required: [customerId, unitId, contractDate, lines]
      properties:
        customerId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        contractDate: { type: string, format: date }
        promisedDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 1000 }
        lines: { type: array, items: { $ref: '#/components/schemas/SalesLineRequest' } }
        installments: { type: array, items: { $ref: '#/components/schemas/Installment' }, description: 'Na confirmação, a soma precisa ser o total exato' }
    SalesOrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        customerCode: { type: string }
        customerName: { type: string }
        unitName: { type: string }
        proposalCode: { type: [string, 'null'] }
        contractDate: { type: string, format: date }
        totalCents: { $ref: '#/components/schemas/Cents' }
        status: { type: string, enum: [DRAFT, CONFIRMED, IN_EXECUTION, COMPLETED, CANCELLED] }
        version: { type: string }
    SalesOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PV00001 }
        customerId: { type: string, format: uuid }
        customerCode: { type: string }
        customerName: { type: string }
        unitId: { type: string, format: uuid }
        unitName: { type: string }
        proposalId: { type: [string, 'null'], format: uuid }
        proposalCode: { type: [string, 'null'] }
        proposalRevision: { type: [integer, 'null'] }
        contractDate: { type: string, format: date }
        promisedDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'] }
        status: { type: string, enum: [DRAFT, CONFIRMED, IN_EXECUTION, COMPLETED, CANCELLED] }
        totalCents: { $ref: '#/components/schemas/Cents' }
        scheduledCents: { $ref: '#/components/schemas/Cents' }
        lines: { type: array, items: { $ref: '#/components/schemas/SalesLine' } }
        installments: { type: array, items: { $ref: '#/components/schemas/Installment' } }
        confirmedAt: { type: [string, 'null'], format: date-time }
        confirmedBy: { type: [string, 'null'] }
        projectId: { type: [string, 'null'], format: uuid }
        projectCode: { type: [string, 'null'] }
        projectStage: { type: [string, 'null'] }
        equipment:
          type: array
          items: { type: object, properties: { id: { type: string }, code: { type: string }, model: { type: string }, serialNumber: { type: [string, 'null'] }, status: { type: string } } }
        titles:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              label: { type: string }
              dueDate: { type: string, format: date }
              competence: { type: string, example: '2026-10' }
              originalCents: { $ref: '#/components/schemas/Cents' }
              balanceCents: { $ref: '#/components/schemas/Cents' }
              status: { type: string, enum: [OPEN, PARTIAL, SETTLED, RENEGOTIATED, CANCELLED] }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelledBy: { type: [string, 'null'] }
        cancelReason: { type: [string, 'null'] }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PJ00001 }
        name: { type: string }
        orderId: { type: string, format: uuid }
        orderCode: { type: string }
        customerId: { type: string, format: uuid }
        customerCode: { type: string }
        customerName: { type: string }
        unitId: { type: string, format: uuid }
        unitName: { type: string }
        stage: { type: string, enum: [PLANEJADO, ENGENHARIA, SUPRIMENTOS, PRODUCAO, INSTALACAO, ACEITO, ENCERRADO] }
        contractDelivery: { type: [string, 'null'], format: date }
        contractCents: { $ref: '#/components/schemas/Cents' }
        equipmentCount: { type: integer }
        closedReason: { type: [string, 'null'] }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    EquipmentRequest:
      type: object
      properties:
        serialNumber: { type: [string, 'null'], maxLength: 60 }
        notes: { type: [string, 'null'], maxLength: 1000 }
    Equipment:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: EQ00001 }
        model: { type: string, description: 'Texto do modelo como veio do pedido' }
        modelId: { type: string, format: uuid, description: 'Modelo de equipamento (Sprint 10)' }
        modelCode: { type: string, example: MD00001 }
        modelName: { type: string }
        itemId: { type: [string, 'null'], format: uuid }
        projectId: { type: string, format: uuid }
        projectCode: { type: string }
        orderCode: { type: string }
        customerId: { type: string, format: uuid }
        customerCode: { type: string }
        customerName: { type: string }
