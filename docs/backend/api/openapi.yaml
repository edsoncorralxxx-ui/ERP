        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/transfers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Transferências]
      summary: Transferência (financial_title.read)
      responses:
        '200': { description: Transferência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/transfers/{id}/reversals:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Transferências]
      summary: >-
        Estorna a transferência inteira (transfer.post), com motivo: os dois movimentos inversos, com a data de hoje; já estornada
        devolve a mesma; evento TransferReversed
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Transferência estornada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/transfers/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Transferências]
      summary: Trilha da transferência (financial_title.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/cash-flow:
    get:
      tags: [Fluxo de caixa]
      summary: >-
        Fluxo de caixa mês a mês (financial_title.read): mês passado só realizado; corrente com realizado até hoje, em atraso e
        previsto até o fim do mês; futuro previsto. Saldo final = inicial + entradas − saídas e é o inicial do mês seguinte.
        Filtro de conta recorta o realizado e o saldo inicial; filtro de categoria mostra só o fluxo da categoria (saldo inicial zero)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, example: '2026-07' }, description: 'AAAA-MM; padrão: 3 meses antes do atual' }
        - { name: to, in: query, required: false, schema: { type: string, example: '2027-03' }, description: 'AAAA-MM; padrão: 6 meses depois; até 24 meses' }
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { type: string, example: SERVICOS_TERCEIROS } }
      responses:
        '200': { description: Fluxo, content: { application/json: { schema: { $ref: '#/components/schemas/CashFlow' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/cash-flow/composition:
    get:
      tags: [Fluxo de caixa]
      summary: Movimentos ou títulos que formam um valor do fluxo; a soma é o valor da grade (financial_title.read)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, example: '2026-10' } }
        - name: column
          in: query
          required: true
          schema: { type: string, enum: [OPENING, REALIZED_IN, REALIZED_OUT, OVERDUE_IN, OVERDUE_OUT, FORECAST_IN, FORECAST_OUT] }
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Composição, content: { application/json: { schema: { $ref: '#/components/schemas/CashFlowComposition' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents:
    get:
      tags: [Documentos e faturamento]
      summary: Documentos, os mais recentes primeiro (document.read)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código, número ou cliente' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ATIVOS, CANCELADOS, TODOS], default: ATIVOS } }
        - { name: competence, in: query, required: false, schema: { type: string, example: '2026-09' } }
        - { name: customerId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Documentos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BusinessDocument' } } } } }
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Registra a nota de saída do pedido, emitida fora do Renda+ — RegisterDocument (document.register e document.link). Valor =
        recebido sem nota do pedido (ou o informado, até ele); linhas proporcionais às do pedido e vínculos pela ordem de vencimento,
        com as parcelas bloqueadas. Número único por cliente e série entre as notas ativas (422 DOCUMENT_DUPLICATE); evento DocumentRegistered
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentRequest' } } }
      responses:
        '201': { description: Documento registrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Documentos e faturamento]
      summary: Documento com linhas e vínculos (document.read)
      responses:
        '200': { description: Documento, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/links:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Vincula parcelas — LinkDocumentToTitles (document.link), para refazer um vínculo desfeito. Bloqueia o documento e as parcelas
        em ordem de id; parcela do mesmo cliente, não cancelada, uma vez por documento, até o recebido sem nota; evento DocumentLinkedToTitles
      parameters: [{ $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [links], properties: { links: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DocumentLinkRequest' } } } } } }
      responses:
        '200': { description: Documento com os vínculos, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/links/{linkId}/removals:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Desfaz um vínculo, com motivo (document.link); o valor volta ao a faturar da parcela; já desfeito devolve o documento;
        evento DocumentLinkRemoved
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Vínculo desfeito, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/cancellations:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Documentos e faturamento]
      summary: >-
        Cancela o documento com motivo — CancelDocument (document.cancel); desfaz todos os vínculos; o documento continua
        consultável; cancelar de novo devolve o cancelamento existente; evento DocumentCancelled
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Documento cancelado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/classification:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Documentos e faturamento]
      summary: >-
        Classifica — ClassifyDocument (document.classify): natureza da operação e projeto (de uma parcela vinculada); cada
        reclassificação é uma nova revisão; evento DocumentClassified
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DocumentClassificationRequest' } } }
      responses:
        '200': { description: Documento classificado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/authorization:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Documentos e faturamento]
      summary: >-
        Situação de autorização da nota (document.classify): AUTORIZADA (com o protocolo) ou PENDENTE. Nota pendente continua na
        receita e trava a etapa "Autorizar as notas pendentes" do fechamento; evento DocumentAuthorizationRecorded
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [AUTORIZADA, PENDENTE] }
                protocol: { type: [string, 'null'], maxLength: 60 }
      responses:
        '200': { description: Documento, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDocument' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/documents/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Documentos e faturamento]
      summary: Trilha do documento (document.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/invoicing:
    get:
      tags: [Documentos e faturamento]
      summary: >-
        Faturado por parcela, com as notas vinculadas (document.read): as parcelas não canceladas do cliente (`customerId`) ou as
        indicadas (`titleId`, repetível). A faturar = valor − faturado (IND-003); a emitir = recebido − faturado (regime de caixa)
      parameters:
        - { name: customerId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: titleId, in: query, required: false, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
      responses:
        '200': { description: Parcelas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TitleInvoicing' } } } } }

  /api/v1/invoicing/orders:
    get:
      tags: [Documentos e faturamento]
      summary: >-
        Notas a emitir pelo caixa (document.read): pedidos confirmados com recebido, faturado, a emitir e a divisão do a emitir
        entre produto e serviço; `status` A_EMITIR (padrão, só com recebimento sem nota) ou TODOS
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Número do pedido ou cliente' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [A_EMITIR, TODOS], default: A_EMITIR } }
      responses:
        '200': { description: Pedidos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderInvoicing' } } } } }

  /api/v1/invoicing/orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Documentos e faturamento]
      summary: >-
        Um pedido pelo caixa com a nota proposta (document.read): linhas e parcelas para `amountCents` (o a emitir, se vazio);
        acima do a emitir, 422 DOCUMENT_EXCEEDS_RECEIVED
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [PRODUTO, SERVICO] }, description: 'Tipo da nota proposta; Produto, se houver produto a emitir' }
        - { name: amountCents, in: query, required: false, schema: { $ref: '#/components/schemas/Cents' } }
      responses:
        '200': { description: Pedido, content: { application/json: { schema: { $ref: '#/components/schemas/OrderInvoicing' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/fiscal/dashboard:
    get:
      tags: [Fiscal]
      summary: >-
        Painel fiscal da competência (tax.read; padrão: o mês anterior ao corrente): DAS, RBT12, receita do ano × sublimite,
        obrigações dos próximos 7 dias, séries de 12 competências (RBT12, DAS por anexo — prévia quando não há cálculo gravado),
        DAS por tributo, últimas guias, etapas do fechamento e alertas por regra
      parameters:
        - { name: competence, in: query, required: false, schema: { type: string, example: '2026-09' } }
      responses:
        '200': { description: Painel, content: { application/json: { schema: { $ref: '#/components/schemas/FiscalDashboard' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods:
    get:
      tags: [Fiscal]
      summary: >-
        Histórico de competências do ano (tax.read), da mais recente para a mais antiga, até o mês corrente: receita, RBT12,
        alíquota efetiva, DAS calculado (gravado ou prévia) e a guia mais recente
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer, example: 2026 }, description: 'Padrão: o ano corrente' }
      responses:
        '200': { description: Competências, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxPeriodSummary' } } } } }

  /api/v1/tax-periods/{competence}:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    get:
      tags: [Fiscal]
      summary: >-
        Apuração da competência (tax.read): receita por anexo com as notas, RBT12 mês a mês, cálculo (o último gravado ou a
        prévia), guias, transmissões do PGDAS-D, etapas do fechamento, fechamentos e alertas
      responses:
        '200': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/rbt12:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    put:
      tags: [Fiscal]
      summary: Informa o RBT12 da competência (tax_period.declare) — reserva para mês sem histórico de receita; nova versão da competência
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxRbt12Request' } } }
      responses:
        '200': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/simulations:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Fiscal]
      summary: >-
        Calcula o DAS — RecordTaxSimulation (tax_period.simulate): por anexo e por tributo, com os parâmetros vigentes e o RBT12
        (histórico + notas, ou o informado); sem eles, NAO_CALCULAVEL com o motivo. ISS limitado a 5% da receita do anexo;
        centavo do arredondamento no tributo de maior participação. Cada cálculo é preservado; evento TaxSimulationRecorded
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Competência com o novo cálculo, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/declarations:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Fiscal]
      summary: >-
        Registra a transmissão do PGDAS-D feita no portal (tax_period.declare): data (não futura), recibo e receita declarada
        (padrão: a receita da competência). A obrigação PGDAS-D passa a Entregue; evento TaxDeclarationRecorded
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxDeclarationRequest' } } }
      responses:
        '201': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/das-guides:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Fiscal]
      summary: >-
        Gera a guia DAS (tax_das.issue): número do documento, vencimento, principal (o declarado), multa e juros. Na mesma
        transação cria o título a pagar do total (beneficiário Receita Federal — DAS; categoria IMPOSTOS_SIMPLES). Gerar de novo
        cancela o título anterior sem pagamento; DAS com pagamento: 422 TAX_DAS_PAID; total zero não cria título. Evento TaxDasGuideIssued
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxDasGuideRequest' } } }
      responses:
        '201': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/closing-steps/{step}:
    parameters:
      - { $ref: '#/components/parameters/Competence' }
      - { name: step, in: path, required: true, schema: { type: string, enum: [NOTAS_CONFERIDAS, CANCELAMENTOS_CONFERIDOS, RBT12_CONFERIDO] } }
    put:
      tags: [Fiscal]
      summary: >-
        Conclui ou desfaz uma etapa manual do fechamento (tax_period.close_step); as etapas automáticas seguem os dados (422).
        Evento TaxClosingStepCompleted
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                done: { type: boolean, default: true }
                notes: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200': { description: Competência, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/closures:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Fiscal]
      summary: >-
        Encerra a competência (tax_period.close) com as 7 etapas concluídas: congela receita, cálculo e guia; notas dessa
        competência não são registradas nem canceladas (TAX_PERIOD_CLOSED). Etapa pendente: 422 TAX_PERIOD_INVALID. Encerrar de
        novo devolve a mesma; evento TaxPeriodClosed
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { description: Competência encerrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/reopenings:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    post:
      tags: [Fiscal]
      summary: Reabre a competência encerrada, com motivo (tax_period.reopen); não encerrada → 409; evento TaxPeriodReopened
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 500 } } } } }
      responses:
        '200': { description: Competência reaberta, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxPeriod' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-periods/{competence}/history:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    get:
      tags: [Fiscal]
      summary: Trilha da competência (tax.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/tax-parameters:
    get:
      tags: [Fiscal]
      summary: Revisões dos parâmetros do Simples Nacional por anexo, da mais recente para a mais antiga (tax.read)
      responses:
        '200': { description: Revisões, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxParameters' } } } } }
    post:
      tags: [Fiscal]
      summary: >-
        Nova revisão dos parâmetros, com vigência (tax_parameter.admin): por anexo (I a V), tributos e faixas com a repartição
        (somando 100%). A revisão gravada não muda. Inválida: 422 TAX_PARAMETER_INVALID; evento TaxParameterRevised
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxParametersRequest' } } }
      responses:
        '201': { description: Revisão criada, content: { application/json: { schema: { $ref: '#/components/schemas/TaxParameters' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-setup:
    get:
      tags: [Fiscal]
      summary: Dados da empresa no Simples, limites, atividades e anexos (com quantos itens) e a opção IBS/CBS (tax.read)
      responses:
        '200': { description: Parâmetros da empresa, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSetup' } } } }

  /api/v1/tax-setup/profile:
    put:
      tags: [Fiscal]
      summary: Altera os dados da empresa no Simples e os limites (tax_profile.admin); evento TaxProfileUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxProfileRequest' } } }
      responses:
        '200': { description: Parâmetros da empresa, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSetup' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-setup/history:
    get:
      tags: [Fiscal]
      summary: Histórico de alterações dos dados da empresa no Simples (tax.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/tax-activities:
    post:
      tags: [Fiscal]
      summary: Nova atividade com o enquadramento e o anexo (tax_profile.admin); evento TaxProfileUpdated
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxActivityRequest' } } }
      responses:
        '201': { description: Parâmetros da empresa, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSetup' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-activities/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Fiscal]
      summary: Altera ou inativa a atividade (tax_profile.admin); evento TaxProfileUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxActivityRequest' } } }
      responses:
        '200': { description: Parâmetros da empresa, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSetup' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-ibs-cbs-options:
    post:
      tags: [Fiscal]
      summary: >-
        Registra a opção por IBS e CBS do 1º semestre de 2027 (tax_profile.admin): dentro ou fora do DAS. A obrigação do prazo
        passa a Entregue; evento TaxIbsCbsOptionRecorded
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [DENTRO_DAS, FORA_DAS] }
                notes: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201': { description: Parâmetros da empresa, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSetup' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-revenue-history:
    get:
      tags: [Fiscal]
      summary: Histórico de receita das competências anteriores ao Renda+, por anexo, da mais recente para a mais antiga (tax.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxRevenueHistory' } } } } }

  /api/v1/tax-revenue-history/{competence}:
    parameters: [{ $ref: '#/components/parameters/Competence' }]
    put:
      tags: [Fiscal]
      summary: >-
        Digita a receita de uma competência anterior ao início da receita no Renda+ (tax_profile.admin; If-Match 0 quando ainda
        não há); evento TaxRevenueHistoryRecorded
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxRevenueHistoryRequest' } } }
      responses:
        '200': { description: Competência do histórico, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRevenueHistory' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-revenue-history/imports:
    post:
      tags: [Fiscal]
      summary: >-
        Carga do histórico pelo arquivo JSON (tax_profile.admin): sem confirm, a prévia com os problemas de cada linha; com confirm,
        grava as linhas sem problema. O mesmo conteúdo (hash) não carrega duas vezes; evento TaxRevenueHistoryRecorded
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                fileName: { type: [string, 'null'] }
                content: { type: string, description: 'Conteúdo do arquivo com "historicoReceita" (exemplos/fiscal-exemplo.json)' }
                confirm: { type: boolean, default: false }
      responses:
        '200': { description: Prévia, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRevenueImport' } } } }
        '201': { description: Carga confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/TaxRevenueImport' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-obligations:
    get:
      tags: [Fiscal]
      summary: >-
        Obrigações fiscais e acessórias pelo vencimento (tax.read), com as ocorrências dos modelos recorrentes garantidas até o
        mês corrente; PGDAS-D e DAS seguem a apuração; prazo, atrasada e vence esta semana calculados
      responses:
        '200': { description: Obrigações, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxObligation' } } } } }
    post:
      tags: [Fiscal]
      summary: Nova obrigação avulsa (tax_obligation.update); evento TaxObligationRegistered
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaxObligationRequest' } } }
      responses:
        '201': { description: Obrigação, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxObligation' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-obligations/calendar.ics:
    get:
      tags: [Fiscal]
      summary: Agenda das obrigações pendentes em iCalendar (tax.read)
      responses:
        '200': { description: Agenda, content: { text/calendar: { schema: { type: string } } } }

  /api/v1/tax-obligations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Fiscal]
      summary: Obrigação (tax.read)
      responses:
        '200': { description: Obrigação, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxObligation' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [Fiscal]
      summary: Altera vencimento, responsável, detalhe ou a situação de trabalho (tax_obligation.update); evento TaxObligationUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dueDate: { type: [string, 'null'], format: date }
                responsible: { type: [string, 'null'] }
                detail: { type: [string, 'null'] }
                status: { type: [string, 'null'], enum: [A_ENTREGAR, EM_PREPARACAO, EM_APURACAO, ABERTO, DECISAO_PENDENTE, null] }
      responses:
        '200': { description: Obrigação, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxObligation' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-obligations/{id}/deliveries:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Fiscal]
      summary: >-
        Entrega a obrigação (tax_obligation.update): Entregue (declaração) ou Pago (guia), com data (não futura) e recibo. PGDAS-D
        e DAS seguem a apuração: 422 TAX_OBLIGATION_LINKED. Evento TaxObligationDelivered
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveredOn: { type: [string, 'null'], format: date }
                receiptNumber: { type: [string, 'null'], maxLength: 60 }
                notes: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200': { description: Obrigação, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TaxObligation' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/tax-obligations/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Fiscal]
      summary: Trilha da obrigação (tax.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/fiscal-classification:
    get:
      tags: [Fiscal]
      summary: Itens ativos com o perfil fiscal, a situação (SEM_CLASSIFICACAO, REVISAR, CLASSIFICADO) e o que falta (tax.read)
      responses:
        '200': { description: Itens, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ItemFiscalProfile' } } } } }

  /api/v1/fiscal-classification/{itemId}:
    parameters: [{ name: itemId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Fiscal]
      summary: Classificação fiscal do item (tax.read); ETag = versão do perfil (0 quando nunca classificado)
      responses:
        '200': { description: Item, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ItemFiscalProfile' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [Fiscal]
      summary: >-
        Grava o perfil fiscal (tax_classification.update) e o NCM ou o item da LC 116 no cadastro do item (item.update). O anexo
        vai para as linhas das notas registradas depois; evento ItemFiscalProfileUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemFiscalProfileRequest' } } }
      responses:
        '200': { description: Item, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ItemFiscalProfile' } } } }
        '404': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/fiscal-classification/{itemId}/history:
    parameters: [{ name: itemId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Fiscal]
      summary: Trilha da classificação fiscal do item (tax.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/equipment-models:
    get:
      tags: [Modelos de equipamento]
      summary: Modelos com a quantidade de equipamentos de cada um (bom.read)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código ou nome' }
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Modelos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EquipmentModel' } } } } }
    post:
      tags: [Modelos de equipamento]
      summary: Cadastra o modelo (bom.update); nome único sem diferenciar maiúsculas (422 EQUIPMENT_MODEL_DUPLICATE); evento EquipmentModelRegistered
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModelRequest' } } }
      responses:
        '201': { description: Modelo cadastrado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Modelos de equipamento]
      summary: Modelo (bom.read)
      responses:
        '200': { description: Modelo, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [Modelos de equipamento]
      summary: Renomeia o modelo (bom.update); os equipamentos continuam com o texto do pedido; evento EquipmentModelUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModelRequest' } } }
      responses:
        '200': { description: Modelo alterado, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Modelos de equipamento]
      summary: Inativa o modelo com motivo (bom.update); equipamentos e BOMs existentes continuam
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Modelo inativo, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentModel' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment-models/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Modelos de equipamento]
      summary: Trilha do modelo (bom.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/boms:
    get:
      tags: [BOM]
      summary: BOMs (as dos modelos primeiro, depois as submontagens), com o total e as pendências (bom.read)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código, nome da BOM ou do modelo' }
      responses:
        '200': { description: BOMs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BomSummary' } } } } }
    post:
      tags: [BOM]
      summary: >-
        Cadastra a BOM — CreateBom (bom.update): de um modelo (uma por modelo) ou submontagem (sem modelo), sem linhas. Nome único
        (422 BOM_DUPLICATE)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomRequest' } } }
      responses:
        '201': { description: BOM cadastrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Bom' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/boms/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: >-
        BOM com as linhas, o valor de cada uma, subtotais por categoria, total, pendências, problemas, quem a usa como submontagem e a
        árvore das submontagens (bom.read)
      responses:
        '200': { description: BOM, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Bom' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [BOM]
      summary: >-
        Grava a BOM inteira — UpdateBom (bom.update): linhas na ordem e total informado da origem; vale na hora para as BOMs que a usam.
        Equipamentos não mudam até reaplicar. Item inexistente, quantidade ≤ 0, custo negativo: 422 BOM_INVALID; ciclo de
        submontagens: 422 BOM_CYCLE. Evento BomUpdated
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomContentRequest' } } }
      responses:
        '200': { description: BOM gravada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Bom' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/boms/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: Trilha da BOM, com cada gravação (bom.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/bom-imports:
    post:
      tags: [BOM]
      summary: >-
        Envia o arquivo JSON da BOM e devolve a prévia (bom.update): linhas, submontagens, totais, itens e unidades novos, códigos
        gerados e problemas da origem, sem gravar nada além do arquivo. O mesmo arquivo devolve a mesma carga
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BomImportRequest' } } }
      responses:
        '201': { description: Prévia, content: { application/json: { schema: { $ref: '#/components/schemas/BomImport' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-imports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM]
      summary: Carga e a prévia (bom.read)
      responses:
        '200': { description: Carga, content: { application/json: { schema: { $ref: '#/components/schemas/BomImport' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/bom-imports/{id}/confirmation:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BOM]
      summary: >-
        Confirma a carga — ImportBom (bom.update): modelo, BOM do modelo, submontagens e itens novos, numa transação; BOMs que já
        existem têm as linhas substituídas pelas do arquivo. Confirmar de novo devolve a mesma. Evento BomImported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Carga confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/BomImport' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment/{id}/bom:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM do equipamento]
      summary: BOM do equipamento em árvore, com o estado de cada linha em relação ao modelo; `applied` falso se ainda não tem (bom.read)
      responses:
        '200': { description: BOM do equipamento, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBom' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    post:
      tags: [BOM do equipamento]
      summary: >-
        Aplica ou reaplica a BOM de um modelo — ApplyBomToProject (project_bom.apply): cópia do conteúdo atual, que não muda quando a
        BOM do modelo muda. Reaplicar exige motivo e descarta os ajustes. Linha sem quantidade ou custo: 422 BOM_INCOMPLETE.
        Evento ProjectBomApplied
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBomApplyRequest' } } }
      responses:
        '200': { description: BOM aplicada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBom' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment/{id}/bom/adjustments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BOM do equipamento]
      summary: >-
        Ajusta só este equipamento — AdjustEquipmentBom (project_bom.apply), com motivo: incluir (ADD), alterar quantidade ou custo
        (UPDATE), retirar (REMOVE) ou devolver (RESTORE) uma linha. O modelo não muda. Evento EquipmentBomAdjusted
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBomAdjustRequest' } } }
      responses:
        '200': { description: BOM ajustada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentBom' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/equipment/{id}/bom/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM do equipamento]
      summary: Trilha da BOM do equipamento (bom.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/projects/{id}/planned-cost:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BOM do equipamento]
      summary: >-
        Custo planejado do projeto (project.read e bom.read): soma das BOMs dos equipamentos ativos, valor contratado e margem prevista;
        equipamento sem BOM aparece sem custo, e a margem só sai quando todos têm BOM sem pendência
      responses:
        '200': { description: Custo planejado, content: { application/json: { schema: { $ref: '#/components/schemas/PlannedCost' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  # ───────────── CRM (Sprint 11) ─────────────

  /api/v1/leads:
    get:
      tags: [CRM]
      summary: Prospecções (lead.read), da mais nova para a mais antiga
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código, empresa, cidade ou contato' }
        - { name: stage, in: query, required: false, schema: { type: string, enum: [IDENTIFICADO, CONTATADO, INTERESSADO, DESCARTADO, TODAS] } }
      responses:
        '200': { description: Prospecções, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Lead' } } } } }
    post:
      tags: [CRM]
      summary: Cadastra a prospecção — RegisterLead (lead.create), idempotente; código PS00001; responsável vazio = quem cadastra
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LeadRequest' } } }
      responses:
        '201': { description: Cadastrada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/leads/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [CRM]
      summary: Prospecção (lead.read)
      responses:
        '200': { description: Prospecção, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '404': { $ref: '#/components/responses/Erro' }
    put:
      tags: [CRM]
      summary: Altera a prospecção (lead.update); descartada volta a ficar aberta quando recebe uma etapa aberta
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LeadRequest' } } }
      responses:
        '200': { description: Nova versão, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/leads/{id}/discard:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [CRM]
      summary: Descarta a prospecção com motivo (lead.update); a próxima ação deixa de valer
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Descartada, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/leads/{id}/customer:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [CRM]
      summary: >-
        Converte em cliente (lead.update e partner.create): sem customerId cadastra o cliente com a empresa, a cidade (unidade) e o
        contato, uma única vez; com customerId liga a um cliente que já existe. As oportunidades sem cliente passam a tê-lo
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { customerId: { type: [string, 'null'], format: uuid } } } } }
      responses:
        '200': { description: Prospecção com o cliente, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Lead' } } } }
        '403': { $ref: '#/components/responses/Erro' }
        '412': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/leads/{id}/interactions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [CRM]
      summary: Interações da prospecção e das oportunidades dela, da mais recente (lead.read)
      responses:
        '200': { description: Interações, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Interaction' } } } } }
    post:
      tags: [CRM]
      summary: >-
        Registra a interação — RecordInteraction (lead.update), idempotente; a próxima ação passa para a prospecção e Identificado
        vira Contatado
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InteractionRequest' } } }
      responses:
        '201': { description: Registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Interaction' } } } }
        '409': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/leads/{id}/opportunities:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [CRM]
      summary: Oportunidades abertas a partir da prospecção (lead.read e opportunity.read)
      responses:
        '200': { description: Oportunidades, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Opportunity' } } } } }

  /api/v1/leads/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [CRM]
      summary: Histórico da prospecção (lead.read)
      responses:
        '200': { description: Histórico, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } } } } }

  /api/v1/lead-imports:
    post:
      tags: [CRM]
      summary: >-
        Envia a lista de prospecção em JSON e devolve a prévia (lead.create); nada é cadastrado. O mesmo arquivo (hash) devolve a
        mesma carga. Linha com ERRO não entra; AVISO (nome repetido ou parecido) entra separada
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } } }
      responses:
        '201': { description: Prévia, content: { application/json: { schema: { $ref: '#/components/schemas/LeadImport' } } } }
        '422': { $ref: '#/components/responses/Erro' }

  /api/v1/lead-imports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [CRM]
      summary: Carga e a prévia (lead.read)
      responses:
        '200': { description: Carga, content: { application/json: { schema: { $ref: '#/components/schemas/LeadImport' } } } }
        '404': { $ref: '#/components/responses/Erro' }

  /api/v1/lead-imports/{id}/confirmation:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [CRM]
      summary: Cadastra as linhas sem erro (lead.create), idempotente; confirmar de novo devolve a mesma carga
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Carga confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/LeadImport' } } } }

  /api/v1/opportunities:
    get:
      tags: [CRM]
      summary: Oportunidades (opportunity.read), com o valor ponderado
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: 'Código, nome, prospecção ou cliente' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ABERTA, GANHA, PERDIDA, TODAS] } }
