<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --fundo: #f4f6fa;
    --superficie: #ffffff;
    --superficie-2: #eef3f7;
    --tinta: #1f2026;
    --tinta-suave: #5a6272;
    --regra: #d3dbe7;
    --azul: #4867b1;
    --azul-fundo: #e6ecf7;
    --ouro: #b07d12;
    --ouro-fundo: #fcf0ae;
    --ok: #23713f;
    --ok-fundo: #e3f1e7;
    --fonte: "IBM Plex Sans", "Segoe UI", Tahoma, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #12151c; --superficie: #1a1f29; --superficie-2: #212835; --tinta: #e6e9ef; --tinta-suave: #9aa4b5;
      --regra: #2e3747; --azul: #8fa9e6; --azul-fundo: #1f2a44; --ouro: #f0c35a; --ouro-fundo: #3a3218; --ok: #6fcf8f; --ok-fundo: #173222;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #12151c; --superficie: #1a1f29; --superficie-2: #212835; --tinta: #e6e9ef; --tinta-suave: #9aa4b5;
    --regra: #2e3747; --azul: #8fa9e6; --azul-fundo: #1f2a44; --ouro: #f0c35a; --ouro-fundo: #3a3218; --ok: #6fcf8f; --ok-fundo: #173222;
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--fundo); color: var(--tinta); font-family: var(--fonte); font-size: 15px; line-height: 1.55; }
  .pagina { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 72px; display: grid; gap: 28px; }
  header { display: grid; gap: 12px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--azul); font-weight: 600; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
  h1 b { color: var(--ouro); font-weight: 700; }
  header p { margin: 0; max-width: 72ch; color: var(--tinta-suave); }
  .numeros { display: flex; flex-wrap: wrap; gap: 10px 28px; font-variant-numeric: tabular-nums; }
  .numeros div { display: grid; }
  .numeros strong { font-size: 24px; line-height: 1.2; }
  .numeros span { font-size: 13px; color: var(--tinta-suave); }
  code { font-family: var(--mono); font-size: .9em; background: var(--superficie-2); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }

  .layout { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
  nav.indice { background: var(--superficie); border: 1px solid var(--regra); border-radius: 6px; padding: 14px 16px; font-size: 13.5px; }
  nav.indice summary { cursor: pointer; font-weight: 600; }
  nav.indice ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  nav.indice > details > ul { margin-top: 10px; gap: 12px; }
  nav.indice ul ul { margin-top: 4px; padding-left: 10px; border-left: 1px solid var(--regra); }
  nav.indice a { display: block; color: var(--tinta); text-decoration: none; padding: 3px 8px; border-radius: 3px; transition: background-color .18s ease; }
  nav.indice a:hover, nav.indice a:focus-visible { background: var(--ouro-fundo); outline: none; }
  nav.indice a.nav-parte { font-weight: 600; color: var(--azul); }

  main { display: grid; gap: 22px; min-width: 0; }
  h2.parte { margin: 18px 0 0; padding-top: 14px; border-top: 2px solid var(--azul); font-size: 24px; line-height: 1.25; text-wrap: balance; scroll-margin-top: 16px; }
  h2.parte:first-child { margin-top: 0; }
  section.bloco { display: grid; gap: 12px; scroll-margin-top: 16px; }
  h3 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; }
  section.bloco p, main > p { margin: 0; max-width: 78ch; color: var(--tinta-suave); }
  section.bloco p strong { color: var(--tinta); }
  .diagrama { background: var(--superficie); border: 1px solid var(--regra); border-radius: 6px; padding: 16px; overflow-x: auto; }
  .diagrama pre.mermaid { margin: 0; min-width: 680px; display: flex; justify-content: center; }

  .tabela { overflow-x: auto; background: var(--superficie); border: 1px solid var(--regra); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--regra); }
  th { background: var(--superficie-2); font-weight: 600; font-size: 12.5px; letter-spacing: .02em; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background-color .18s ease; }
  tbody tr:hover { background: var(--ouro-fundo); }

  .selo { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .selo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .selo--uso { background: var(--ok-fundo); color: var(--ok); }
  .selo--plan { background: var(--azul-fundo); color: var(--azul); }

  @media (min-width: 1000px) {
    .layout { grid-template-columns: 250px minmax(0, 1fr); align-items: start; }
    nav.indice { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } nav.indice a, tbody tr { transition: none; } }
</style>

<div class="pagina">
  <header>
    <div class="eyebrow">Renda+ ERP · servidor Java / Spring Boot</div>
    <h1>__H1__</h1>
    __INTRO__
    <div class="numeros">
      __NUMEROS__
    </div>
  </header>

  <div class="layout">
    <nav class="indice" aria-label="Índice">
      <details open>
        <summary>Índice</summary>
        <ul>__NAV__</ul>
      </details>
    </nav>
    <main>
      __CONTEUDO__
    </main>
  </div>
</div>
